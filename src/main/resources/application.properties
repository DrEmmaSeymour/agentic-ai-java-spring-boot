spring.application.name=task-api

# --- AI task agent (POST /agent/chat) ---
# The Anthropic API key is read from the ANTHROPIC_API_KEY environment variable by Spring AI.
# Never put a key in this file.
#
# Every setting below can be overridden with an environment variable, e.g.
#   TASK_AGENT_MODEL=claude-opus-5-5   TASK_AGENT_EFFORT=medium
task-agent.model=claude-haiku-5-5
task-agent.effort=low
task-agent.max-tokens=16000
task-agent.max-writes-per-request=3
task-agent.max-tool-calls-per-request=10
